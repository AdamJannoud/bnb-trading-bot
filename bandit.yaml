# Bandit configuration for the CI `lint` job:
#   bandit -c bandit.yaml -r . -x ./.venv -q
# Every skipped test needs a reason here. Intentional single sites are
# suppressed in place with a line-scoped `# nosec <ID> - <reason>` instead.
skips:
